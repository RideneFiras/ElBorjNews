<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>البرج في حلّة جديدة</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=block" rel="stylesheet">
<style>
/* Facebook post announcing the new look, the new address borj.tn and contact@borj.tn.
   1080×1350 (portrait, the largest a feed shows). Open it in a browser to see it animate;
   render.mjs takes the still with ?still. The phone shows a real screenshot of the site. */
:root {
  --navy: #163a5f;
  --navy-deep: #0f2a45;
  --paper: #fbf8f1;
  --ink: #14110c;
  --lamp: #f2b33d;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
body { background: var(--navy); color: var(--paper); position: relative; font-family: 'IBM Plex Sans Arabic', sans-serif; }

/* Masthead line, as on the site */
.mast { position: absolute; top: 56px; right: 72px; left: 72px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid rgb(251 248 241 / 0.45); padding-bottom: 18px; }
.mast .brand { display: flex; align-items: center; gap: 16px; }
.mast img { width: 120px; }
.mast .name { font-family: 'Aref Ruqaa'; font-size: 64px; line-height: 1; }
.mast .date { font-weight: 600; font-size: 26px; color: rgb(251 248 241 / 0.8); }

/* Headline */
.head { position: absolute; top: 190px; right: 72px; width: 600px; }
.head .kicker { display: inline-block; background: var(--lamp); color: var(--navy-deep); font-weight: 700; font-size: 28px; padding: 4px 14px 2px; }
.head h1 { margin: 22px 0 0; font-family: 'Markazi Text'; font-weight: 700; font-size: 112px; line-height: 1.08; }
.head h1 .word { font-family: 'Aref Ruqaa'; font-size: 150px; line-height: 1; display: block; margin-bottom: 64px; }
.head p { margin: 28px 0 0; font-size: 32px; line-height: 1.6; color: rgb(251 248 241 / 0.92); }
.head ul { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 14px; }
.head li { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; }
.head li i { width: 18px; height: 18px; flex: none; }

/* Phone showing the real homepage */
.phone { position: absolute; top: 230px; left: 64px; width: 316px; height: 660px; background: #0b0d10; border-radius: 46px; padding: 14px;
  box-shadow: 0 30px 60px rgb(0 0 0 / 0.35); }
.phone .screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: var(--paper); }
.phone .screen img { width: 100%; display: block; }

/* Paper block: the address and the email */
.paper { position: absolute; right: 0; left: 0; bottom: 22px; height: 400px; background: var(--paper); color: var(--ink); padding: 54px 72px 0; }
.paper .label { font-weight: 600; font-size: 30px; color: #3a342b; }
.paper .url { direction: ltr; text-align: right; font-family: 'Markazi Text'; font-weight: 700; font-size: 168px; line-height: 0.95; color: var(--navy); margin-top: 6px; }
.paper .row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-top: 30px; border-top: 2px solid #14110c; padding-top: 22px; }
.paper .mail { direction: ltr; font-family: 'Markazi Text'; font-weight: 700; font-size: 58px; color: var(--ink); }
.paper .fb { font-weight: 600; font-size: 28px; color: #3a342b; }

/* The sections' colours, as on the site's menu */
.strip { position: absolute; right: 0; left: 0; bottom: 0; height: 22px; display: flex; }
.strip i { flex: 1; }

/* Entrance (browser only; ?still shows the final frame) */
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.anim .mast, .anim .head > *, .anim .phone, .anim .paper > * { animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
.anim .strip { transform-origin: right; animation: grow 900ms cubic-bezier(0.22, 1, 0.36, 1) both; }
@media (prefers-reduced-motion: reduce) { .anim * { animation: none !important; } }
</style>
</head>
<body>
  <header class="mast">
    <div class="brand"><img src="borj-mark-white.svg" alt=""><span class="name">البرج</span></div>
    <span class="date">أكتوبر 2026</span>
  </header>

  <section class="head">
    <span class="kicker">جديد</span>
    <h1><span class="word">البرج</span>في حلّة جديدة</h1>
    <ul>
      <li><i style="background:#1b7339"></i>ألوان أوضح لكل قسم</li>
      <li><i style="background:#0b5f8c"></i>خطّ أكبر وقراءة أسهل</li>
      <li><i style="background:#b3121b"></i>مصمّمة للهاتف أوّلًا</li>
    </ul>
  </section>

  <div class="phone"><div class="screen"><img src="site-phone.png" alt=""></div></div>

  <section class="paper">
    <div class="label">عنواننا الجديد</div>
    <div class="url">borj.tn</div>
    <div class="row">
      <span class="fb">للتواصل والإعلانات</span>
      <span class="mail">contact@borj.tn</span>
    </div>
  </section>

  <div class="strip">
    <i style="background:#b3121b"></i><i style="background:#0b5f8c"></i><i style="background:#56690f"></i><i style="background:#b8420a"></i><i style="background:#1b7339"></i>
    <i style="background:#8a5600"></i><i style="background:#00707a"></i><i style="background:#2350a8"></i><i style="background:#8a3a1a"></i><i style="background:#3d3a36"></i>
  </div>

<script>
  // Staggered entrance when the file is opened in a browser; the rendered PNG uses ?still.
  if (!location.search.includes('still')) {
    document.body.classList.add('anim');
    document.querySelectorAll('.mast, .head > *, .phone, .paper > *').forEach((el, i) => {
      el.style.animationDelay = `${120 + i * 110}ms`;
    });
    document.querySelector('.strip').style.animationDelay = '200ms';
  }
</script>
</body>
</html>
