<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=block" rel="stylesheet">
<style>
/* Cover, October 2026 look. Facebook puts the profile circle over the middle of the lower
   half, so the centre bottom stays empty: name on one side, address on the other. The strip at
   the bottom is the sections' colours, as on the site's menu. */
html,body{margin:0;width:1640px;height:624px;background:#163A5F;color:#FBF8F1;overflow:hidden;position:relative}
.top{position:absolute;top:56px;left:120px;right:120px;border-top:2px solid rgba(251,248,241,.55)}
.kick{position:absolute;top:76px;left:0;right:0;text-align:center;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:27px;color:rgba(251,248,241,.85)}
.brand{position:absolute;right:250px;top:128px;width:470px;text-align:center}
.brand img{width:220px;display:block;margin:0 auto 4px}
.name{font-family:'Aref Ruqaa';font-size:140px;line-height:1}
.tag{font-family:'IBM Plex Sans Arabic';font-weight:500;font-size:26px;margin-top:52px;color:rgba(251,248,241,.85)}
.addr{position:absolute;left:250px;top:175px;width:470px;text-align:center}
.addr .label{font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:26px;color:rgba(251,248,241,.85)}
.addr .url{direction:ltr;font-family:'Markazi Text';font-weight:700;font-size:118px;line-height:1.05;margin-top:6px}
.addr .mail{direction:ltr;display:inline-block;margin-top:14px;background:#FBF8F1;color:#163A5F;font-family:'Markazi Text';font-weight:700;font-size:38px;padding:4px 18px 2px}
.strip{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex}
.strip i{flex:1}
.guide{position:absolute;top:0;bottom:0;left:265px;right:265px;outline:3px dashed rgba(242,179,61,.9)}
</style></head><body>
<div class="top"></div>
<div class="kick">أخبار · ثقافة · رياضة · الوطن القبلي</div>
<div class="brand"><img src="borj-mark-white.svg" alt=""><div class="name">البرج</div><div class="tag">جريدة إلكترونية مستقلّة</div></div>
<div class="addr"><div class="label">موقعنا الجديد</div><div class="url">borj.tn</div><div class="mail">contact@borj.tn</div></div>
<div class="strip"><i style="background:#B3121B"></i><i style="background:#0B5F8C"></i><i style="background:#56690F"></i><i style="background:#B8420A"></i><i style="background:#1B7339"></i><i style="background:#8A5600"></i><i style="background:#00707A"></i><i style="background:#2350A8"></i><i style="background:#8A3A1A"></i><i style="background:#3D3A36"></i></div>
<div class="guide" id="g"></div>
</body></html>
