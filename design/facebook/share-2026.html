<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Markazi+Text:wght@700&family=IBM+Plex+Sans+Arabic:wght@500&display=block" rel="stylesheet">
<style>
/* Default share picture (og:image) for pages without their own photo, e.g. the homepage:
   1200×630, Facebook's link-preview size. Upload it in the admin → Réglages →
   «Image de partage par défaut». Facebook may crop the sides on phones: content stays central. */
html,body{margin:0;width:1200px;height:630px;background:#163A5F;color:#FBF8F1;overflow:hidden;position:relative}
.c{position:absolute;inset:0 0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
img{width:250px}
.name{font-family:'Aref Ruqaa';font-size:150px;line-height:1.05;margin-top:-6px}
.tag{font-family:'IBM Plex Sans Arabic';font-weight:500;font-size:30px;margin-top:62px;color:rgba(251,248,241,.85)}
.url{font-family:'Markazi Text';font-weight:700;font-size:40px;margin-top:10px;direction:ltr}
.strip{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex}.strip i{flex:1}
</style></head><body>
<div class="c"><img src="borj-mark-white.svg" alt=""><div class="name">البرج</div><div class="tag">جريدة إلكترونية مستقلّة</div><div class="url">borj.tn</div></div>
<div class="strip"><i style="background:#B3121B"></i><i style="background:#0B5F8C"></i><i style="background:#56690F"></i><i style="background:#B8420A"></i><i style="background:#1B7339"></i><i style="background:#8A5600"></i><i style="background:#00707A"></i><i style="background:#2350A8"></i><i style="background:#8A3A1A"></i><i style="background:#3D3A36"></i></div>
</body></html>
